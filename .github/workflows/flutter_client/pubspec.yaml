name: attendance_app
description: "Offline University Attendance Client with Immutable Hardware Binding and Rolling QR Scanner."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^5.2.3
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^10.1.2
  http: ^1.2.2
  uuid: ^4.5.1
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
