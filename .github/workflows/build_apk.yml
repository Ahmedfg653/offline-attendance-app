name: Build Offline Attendance APK Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed / Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart Version
        run: flutter --version

      - name: Install Project Dependencies
        working-directory: flutter_client
        run: flutter pub get

      - name: Build Release APK
        working-directory: flutter_client
        run: flutter build apk --release --split-per-abi=false

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendance-app-release
          path: flutter_client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
